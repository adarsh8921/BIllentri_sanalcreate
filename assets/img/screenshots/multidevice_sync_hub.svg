<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#043a2c"/>
      <stop offset="50%" stop-color="#022119"/>
      <stop offset="100%" stop-color="#01130e"/>
    </radialGradient>
    
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#01130e" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Screen UI Gradients -->
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#03251c"/>
      <stop offset="100%" stop-color="#011812"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Filter Shadows -->
    <filter id="shadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10b981" flood-opacity="0.25"/>
    </filter>

    <filter id="glowPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Glowing Ambient Spheres -->
  <circle cx="400" cy="280" r="280" fill="url(#emeraldGlow)"/>
  <circle cx="180" cy="380" r="160" fill="url(#emeraldGlow)" opacity="0.6"/>
  <circle cx="620" cy="380" r="160" fill="url(#emeraldGlow)" opacity="0.6"/>

  <!-- Grid Pattern Overlay -->
  <g opacity="0.07" stroke="#34d399" stroke-width="1">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800 M0 500 H800"/>
    <path d="M100 0 V600 M200 0 V600 M300 0 V600 M400 0 V600 M500 0 V600 M600 0 V600 M700 0 V600"/>
  </g>

  <!-- Connection Data Sync Pulses -->
  <g stroke="#34d399" stroke-width="2.5" stroke-dasharray="6,6" opacity="0.6">
    <!-- Center to Left (Tablet) -->
    <path d="M400 240 Q280 200 220 280" fill="none"/>
    <!-- Center to Right (Phone) -->
    <path d="M400 240 Q520 200 600 300" fill="none"/>
    <!-- Sync Loop Waves -->
    <circle cx="400" cy="240" r="60" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>
    <circle cx="400" cy="240" r="90" fill="none" stroke="#34d399" stroke-width="1" opacity="0.25"/>
  </g>

  <!-- ==========================================
       1. CENTRAL DESKTOP PC MONITOR
       ========================================== -->
  <g filter="url(#shadowLg)" transform="translate(190, 80)">
    <!-- Monitor Stand -->
    <path d="M190 320 L230 320 L240 370 L180 370 Z" fill="#082c22" stroke="#10b981" stroke-width="1.5"/>
    <rect x="150" y="370" width="120" height="12" rx="6" fill="#0a382c" stroke="#34d399" stroke-width="1.5"/>
    
    <!-- Monitor Bezel & Frame -->
    <rect x="0" y="0" width="420" height="280" rx="18" fill="#031f17" stroke="url(#glassBorder)" stroke-width="2.5"/>
    
    <!-- Screen View -->
    <rect x="12" y="12" width="396" height="256" rx="10" fill="url(#screenBg)"/>
    
    <!-- App Header Bar -->
    <rect x="12" y="12" width="396" height="34" rx="10" fill="#063527"/>
    <circle cx="32" cy="29" r="4.5" fill="#ef4444"/>
    <circle cx="46" cy="29" r="4.5" fill="#f59e0b"/>
    <circle cx="60" cy="29" r="4.5" fill="#10b981"/>
    <text x="80" y="33" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11" font-weight="600">BillEntri Cloud POS - Windows Desktop</text>
    
    <!-- Status Pill -->
    <rect x="300" y="21" width="94" height="18" rx="9" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="1"/>
    <circle cx="312" cy="30" r="3" fill="#34d399"/>
    <text x="320" y="33" fill="#a7f3d0" font-family="Inter, sans-serif" font-size="9" font-weight="700">LIVE SYNC</text>

    <!-- App Content Grid -->
    <!-- Sidebar -->
    <rect x="22" y="56" width="70" height="200" rx="6" fill="#04281e" opacity="0.6"/>
    <rect x="30" y="66" width="54" height="12" rx="4" fill="#10b981" opacity="0.3"/>
    <rect x="30" y="86" width="54" height="10" rx="3" fill="#ffffff" opacity="0.1"/>
    <rect x="30" y="104" width="54" height="10" rx="3" fill="#ffffff" opacity="0.1"/>
    <rect x="30" y="122" width="54" height="10" rx="3" fill="#ffffff" opacity="0.1"/>

    <!-- Main Dashboard Metrics -->
    <g transform="translate(102, 56)">
      <!-- KPI Card 1 -->
      <rect x="0" y="0" width="92" height="48" rx="8" fill="#064030" stroke="#10b981" stroke-width="1" opacity="0.8"/>
      <text x="10" y="18" fill="#94a3b8" font-family="Inter, sans-serif" font-size="9">Total Revenue</text>
      <text x="10" y="38" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="800">₹84,250</text>

      <!-- KPI Card 2 -->
      <rect x="100" y="0" width="92" height="48" rx="8" fill="#064030" stroke="#10b981" stroke-width="1" opacity="0.8"/>
      <text x="110" y="18" fill="#94a3b8" font-family="Inter, sans-serif" font-size="9">Bills Generated</text>
      <text x="110" y="38" fill="#34d399" font-family="Inter, sans-serif" font-size="14" font-weight="800">142 Invoices</text>

      <!-- KPI Card 3 -->
      <rect x="200" y="0" width="96" height="48" rx="8" fill="#064030" stroke="#10b981" stroke-width="1" opacity="0.8"/>
      <text x="210" y="18" fill="#94a3b8" font-family="Inter, sans-serif" font-size="9">Active Sync</text>
      <text x="210" y="38" fill="#38bdf8" font-family="Inter, sans-serif" font-size="14" font-weight="800">3 Branches</text>

      <!-- Revenue Chart Area -->
      <rect x="0" y="56" width="192" height="136" rx="8" fill="#042a1f" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
      <text x="12" y="74" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10" font-weight="700">Real-Time Branch Revenue</text>
      <!-- Chart Curve -->
      <path d="M12 160 Q50 140 80 150 T140 100 T180 85" fill="none" stroke="url(#accentGrad)" stroke-width="3"/>
      <path d="M12 160 Q50 140 80 150 T140 100 T180 85 L180 176 L12 176 Z" fill="url(#accentGrad)" fill-opacity="0.12"/>
      
      <!-- Live Sync List -->
      <rect x="200" y="56" width="96" height="136" rx="8" fill="#042a1f" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
      <text x="208" y="74" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="9" font-weight="700">Sync Feeds</text>
      <circle cx="214" cy="94" r="3" fill="#10b981"/>
      <text x="222" y="97" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="8">Branch 1: +₹1,200</text>
      <circle cx="214" cy="118" r="3" fill="#10b981"/>
      <text x="222" y="121" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="8">Branch 2: +₹3,450</text>
      <circle cx="214" cy="142" r="3" fill="#38bdf8"/>
      <text x="222" y="145" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="8">Mobile App Sync</text>
      <circle cx="214" cy="166" r="3" fill="#10b981"/>
      <text x="222" y="169" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="8">Cloud Backup OK</text>
    </g>
  </g>

  <!-- ==========================================
       2. TABLET (LEFT DEVICE)
       ========================================== -->
  <g filter="url(#shadowLg)" transform="translate(60, 240) rotate(-6)">
    <!-- Tablet Bezel -->
    <rect x="0" y="0" width="220" height="290" rx="20" fill="#04231a" stroke="url(#glassBorder)" stroke-width="2"/>
    <rect x="10" y="10" width="200" height="270" rx="12" fill="#021a13"/>
    
    <!-- Tablet Top Notch -->
    <circle cx="110" cy="18" r="3" fill="#094030"/>
    
    <!-- Tablet Screen Header -->
    <rect x="18" y="28" width="184" height="28" rx="6" fill="#06382a"/>
    <text x="28" y="46" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="700">Tablet POS Counter</text>
    <rect x="150" y="34" width="44" height="16" rx="8" fill="#10b981" fill-opacity="0.3"/>
    <text x="158" y="45" fill="#34d399" font-family="Inter, sans-serif" font-size="8" font-weight="700">SYNC</text>

    <!-- Quick Item Grid -->
    <rect x="18" y="64" width="86" height="54" rx="6" fill="#053023" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
    <text x="26" y="82" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="9" font-weight="700">Item #104</text>
    <text x="26" y="104" fill="#34d399" font-family="Inter, sans-serif" font-size="12" font-weight="800">₹450</text>

    <rect x="114" y="64" width="88" height="54" rx="6" fill="#053023" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
    <text x="122" y="82" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="9" font-weight="700">Item #105</text>
    <text x="122" y="104" fill="#34d399" font-family="Inter, sans-serif" font-size="12" font-weight="800">₹899</text>

    <!-- Receipt Preview Cart -->
    <rect x="18" y="126" width="184" height="142" rx="8" fill="#04261c" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
    <text x="28" y="144" fill="#94a3b8" font-family="Inter, sans-serif" font-size="9">Active Order #8921</text>
    <line x1="28" y1="154" x2="192" y2="154" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="28" y="172" fill="#ffffff" font-family="Inter, sans-serif" font-size="10">2x Grocery Pack</text>
    <text x="160" y="172" fill="#34d399" font-family="Inter, sans-serif" font-size="10" font-weight="700">₹900</text>
    <text x="28" y="194" fill="#ffffff" font-family="Inter, sans-serif" font-size="10">1x Dairy Milk 500g</text>
    <text x="160" y="194" fill="#34d399" font-family="Inter, sans-serif" font-size="10" font-weight="700">₹180</text>

    <!-- Checkout Button -->
    <rect x="28" y="218" width="164" height="36" rx="8" fill="url(#accentGrad)"/>
    <text x="68" y="240" fill="#021f17" font-family="Inter, sans-serif" font-size="11" font-weight="800">PRINT &amp; SYNC</text>
  </g>

  <!-- ==========================================
       3. SMARTPHONE (RIGHT DEVICE)
       ========================================== -->
  <g filter="url(#shadowLg)" transform="translate(570, 230) rotate(8)">
    <!-- Phone Bezel -->
    <rect x="0" y="0" width="165" height="320" rx="28" fill="#04281e" stroke="url(#glassBorder)" stroke-width="2.5"/>
    <rect x="8" y="8" width="149" height="304" rx="22" fill="#01160f"/>
    
    <!-- Dynamic Island / Speaker -->
    <rect x="52" y="14" width="60" height="12" rx="6" fill="#000000"/>
    
    <!-- Mobile App Header -->
    <text x="20" y="48" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="800">BillEntri Mobile</text>
    <circle cx="140" cy="44" r="5" fill="#10b981"/>
    
    <!-- Today's Revenue Card -->
    <rect x="16" y="60" width="133" height="66" rx="10" fill="url(#accentGrad)" fill-opacity="0.2" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="78" fill="#a7f3d0" font-family="Inter, sans-serif" font-size="9" font-weight="600">TODAY'S TOTAL</text>
    <text x="26" y="104" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="900">₹84,250</text>

    <!-- Mobile Mini Chart -->
    <rect x="16" y="136" width="133" height="74" rx="10" fill="#042b1f" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
    <text x="24" y="152" fill="#94a3b8" font-family="Inter, sans-serif" font-size="8">Hourly Traffic</text>
    <path d="M24 194 L44 180 L64 186 L84 165 L104 172 L134 158" fill="none" stroke="#34d399" stroke-width="2"/>

    <!-- Bottom Actions -->
    <rect x="16" y="220" width="133" height="36" rx="8" fill="#053526" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
    <text x="32" y="242" fill="#34d399" font-family="Inter, sans-serif" font-size="10" font-weight="700">📱 WhatsApp Bill</text>

    <rect x="16" y="264" width="133" height="36" rx="8" fill="#053526" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
    <text x="32" y="286" fill="#38bdf8" font-family="Inter, sans-serif" font-size="10" font-weight="700">☁ Cloud Ledger</text>
  </g>

  <!-- ==========================================
       4. CENTRAL CLOUD NODE BADGE
       ========================================== -->
  <g filter="url(#glowPulse)" transform="translate(350, 200)">
    <!-- Outer Glow Circle -->
    <circle cx="50" cy="50" r="46" fill="#021c15" stroke="url(#glassBorder)" stroke-width="3"/>
    <!-- Cloud Icon SVG -->
    <path d="M35 58 Q28 58 26 50 Q24 42 32 38 Q34 26 46 26 Q56 26 62 34 Q70 34 72 44 Q76 46 76 52 Q76 58 68 58 Z" fill="url(#accentGrad)"/>
    <circle cx="50" cy="44" r="5" fill="#ffffff"/>
  </g>

  <!-- Floating Floating Feature Badges -->
  <!-- Top Left Badge -->
  <g filter="url(#shadowLg)" transform="translate(70, 60)">
    <rect x="0" y="0" width="170" height="38" rx="19" fill="#03261c" stroke="#34d399" stroke-width="1.5" opacity="0.95"/>
    <circle cx="20" cy="19" r="6" fill="#10b981"/>
    <text x="34" y="23" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="700">Multi-Device Sync</text>
  </g>

  <!-- Bottom Center Badge -->
  <g filter="url(#shadowLg)" transform="translate(300, 520)">
    <rect x="0" y="0" width="200" height="42" rx="21" fill="#03261c" stroke="#34d399" stroke-width="1.5" opacity="0.95"/>
    <text x="24" y="26" fill="#34d399" font-family="Inter, sans-serif" font-size="12" font-weight="800">⚡ Zero Data Loss Cloud</text>
  </g>
</svg>
